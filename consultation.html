<!DOCTYPE html>
<html>

<head>

    <title>Consultation Notes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h2>Consultation Notes</h2>

        <form
            method="POST"
            action="/consultation/save"
        >

            Appointment ID:

            <input
                type="number"
                name="appointment_id"
                required
            >

            <br><br>


            Notes:

            <br>

            <textarea
                name="notes"
                rows="6"
                cols="40"
                required
            ></textarea>

            <br><br>


            <button type="submit">
                Save Consultation Notes
            </button>

        </form>

        <br>

        <a href="/consultations">
            View Consultation Notes
        </a>

        <br><br>

        <a href="/">
            Back to Home
        </a>

    </div>

</body>

</html>
